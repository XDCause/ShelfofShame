server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/... -> the api container. Docker's internal DNS (127.0.0.11) turns "api" into the
    # container's address. Using a variable makes nginx look it up per request, so it keeps
    # working if the api container is recreated with a new address.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Everything else is the React app.
    location / {
        try_files $uri /index.html;
    }
}
