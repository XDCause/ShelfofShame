# (A template: the nginx image fills in ${HTTPS_PORT} from the environment when it starts - docker-compose.yml.)

# Plain http (port 80 in here; 8080 on the PC): only a way in. Everything goes to https, except the CA certificate a
# phone downloads to trust the app (http://<PC>:8080/ca.crt - it's public, there's nothing secret in it) and the
# container's own health check.
server {
    listen 80;
    include /etc/nginx/security-headers.inc;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location = /ca.crt {
        alias /etc/nginx/certs/offtheclock-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="offtheclock-ca.crt"' always;
    }

    location / { return 301 https://$host:${HTTPS_PORT}$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    root /usr/share/nginx/html;

    # HTTPS with the app's own certificate (make-cert.ps1): TLS 1.2 / 1.3 only, modern ciphers (nginx's defaults).
    # No HSTS on purpose: it's a home certificate, and HSTS would lock a browser out if it were ever replaced badly.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    # Photos are shrunk in the browser before upload, but allow up to the API's own 5 MB limit
    # (nginx's default is 1 MB).
    client_max_body_size 6m;

    # Compress text files on the way out (the journal editor is ~0.9 MB, ~0.3 MB compressed).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nosniff, no framing by other sites, referrer and content security policy: see the file.
    include /etc/nginx/security-headers.inc;

    # /api/... -> the api container. Docker's internal DNS (127.0.0.11) turns "api" into the
    # container's address. Using a variable makes nginx look it up per request, so it keeps
    # working if the api container is recreated with a new address.
    # X-Real-IP: who's asking (the API slows down repeated wrong passwords per address).
    resolver 127.0.0.11 valid=10s;

    # Uploading a video: up to 4 GB, passed straight on to the api as it arrives (not held in
    # nginx first), with time for a slow upload.
    location ~ ^/api/volleyball/videos/[0-9]+/file$ {
        include /etc/nginx/security-headers.inc;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Shop look-ups wait their turn (one request a second, a wait after "slow down"): an army's whole
        # range can take a minute or two the first time. Everything else answers in milliseconds.
        proxy_read_timeout 180s;
    }

    # Vite names built files by their contents (index-84469jgD.js), so a changed file gets a new
    # name: the browser can keep them for a year.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else is the React app. index.html is checked every time, so a new version (with
    # new file names in it) shows up straight away.
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
